name: Verify Tam Ngữ iOS Glance Deck

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "app/**"
      - "public/widget-lessons.json"
      - "scripts/generate-widget-lessons.mjs"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/native-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tam-ngu-native-ios
  cancel-in-progress: true

jobs:
  unsigned-native-builds:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and synchronize the reviewed offline app
        run: npm run build:native
      - name: Compile the app and WidgetKit extension without signing secrets
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build an unsigned device IPA for local Personal Team signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          app_path="build/ios-device/Build/Products/Release-iphoneos/App.app"
          widget_path="$app_path/PlugIns/TamNguWidgets.appex"
          test -d "$app_path"
          test -d "$widget_path"
          test -f "$app_path/Info.plist"
          test -f "$widget_path/Info.plist"

          mkdir -p build/ipa/Payload
          ditto "$app_path" build/ipa/Payload/App.app
          (
            cd build/ipa
            ditto -c -k --sequesterRsrc --keepParent Payload TamNgu6H-unsigned.ipa
            shasum -a 256 TamNgu6H-unsigned.ipa > TamNgu6H-unsigned.ipa.sha256
          )
      - name: Upload the unsigned device package
        uses: actions/upload-artifact@v7
        with:
          name: TamNgu6H-unsigned-ipa
          path: |
            build/ipa/TamNgu6H-unsigned.ipa
            build/ipa/TamNgu6H-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
