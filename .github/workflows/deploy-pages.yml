name: Deploy Tam Ngữ 6H to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 00:23 Asia/Ho_Chi_Minh. Tránh đầu giờ vì GitHub có thể trì hoãn cron.
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      append_lessons:
        description: "Tạo thêm tối đa 3 bài đã kiểm định bằng Gemini"
        required: false
        default: false
        type: boolean

concurrency:
  group: tam-ngu-production
  cancel-in-progress: false

jobs:
  grow_curriculum:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.append_lessons == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append up to 3 independently verified lessons
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          APPEND_LESSON_COUNT: 1
          GENERATION_ATTEMPTS: 2
        run: |
          accepted=0
          for candidate in $(seq 1 8); do
            if [ "$accepted" -ge 3 ]; then
              break
            fi
            backup="$(mktemp)"
            cp app/curriculum.json "$backup"
            echo "Generating candidate $candidate/8"
            if npm run append:curriculum && npm run verify:curriculum; then
              accepted=$((accepted + 1))
              echo "Accepted lesson $accepted/3"
            else
              cp "$backup" app/curriculum.json
              echo "Rejected candidate $candidate; restored the last verified curriculum."
            fi
            rm -f "$backup"
          done
          echo "Accepted $accepted/3 new lessons. Existing production content remains valid when Gemini is unavailable."
      - name: Preserve newly generated lessons
        run: |
          git config user.name "tam-ngu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/curriculum.json
          if ! git diff --cached --quiet; then
            git commit -m "Grow daily Gemini curriculum [skip ci]"
            git push
          fi

  build:
    if: always() && (needs.grow_curriculum.result == 'success' || needs.grow_curriculum.result == 'skipped')
    needs: grow_curriculum
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Verify curriculum, PWA shell, privacy and production build
        run: npm test
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NEXT_PUBLIC_PUSH_API_URL: ${{ vars.NEXT_PUBLIC_PUSH_API_URL }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    if: always() && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify the live app and its private-key backend
        env:
          SMOKE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SMOKE_API_URL: ${{ vars.NEXT_PUBLIC_PUSH_API_URL }}
          # Pages và backend triển khai song song. Việc bắt buộc heartbeat nằm ở
          # workflow Supabase và monitor theo giờ để tránh báo lỗi do race deploy.
          SMOKE_REQUIRE_SCHEDULER: "0"
        run: npm run smoke:production
