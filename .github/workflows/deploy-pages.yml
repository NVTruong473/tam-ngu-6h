name: Deploy Tam Ngữ 6H to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 00:23 Asia/Ho_Chi_Minh. Tránh đầu giờ vì GitHub có thể trì hoãn cron.
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      append_lessons:
        description: "Tạo thêm 24 bài bằng Gemini trước khi phát hành"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append 24 reviewed lessons from Gemini
        id: grow
        if: github.event_name == 'schedule' || inputs.append_lessons == true
        continue-on-error: true
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          APPEND_LESSON_COUNT: 6
          GENERATION_ATTEMPTS: 8
        run: |
          for batch in 1 2 3 4; do
            echo "Generating reviewed lesson batch $batch/4"
            npm run append:curriculum
          done
      - name: Verify generated curriculum before publishing
        id: verify_curriculum
        if: steps.grow.outcome == 'success'
        continue-on-error: true
        run: npm run verify:curriculum
      - name: Stop an invalid generated curriculum from deploying
        if: steps.grow.outcome == 'success' && steps.verify_curriculum.outcome != 'success'
        run: |
          echo "Generated curriculum failed verification; refusing to publish it."
          exit 1
      - name: Preserve newly generated lessons
        if: steps.grow.outcome == 'success' && steps.verify_curriculum.outcome == 'success'
        run: |
          git config user.name "tam-ngu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/curriculum.json
          if ! git diff --cached --quiet; then
            git commit -m "Grow daily Gemini curriculum [skip ci]"
            git push
          fi
      - run: npm run build:github
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NEXT_PUBLIC_PUSH_API_URL: ${{ vars.NEXT_PUBLIC_PUSH_API_URL }}
          NEXT_PUBLIC_FEEDBACK_FORM_URL: ${{ vars.NEXT_PUBLIC_FEEDBACK_FORM_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
